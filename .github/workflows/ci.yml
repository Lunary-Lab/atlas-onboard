name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: |
          cd ./payload
          uv venv
          source .venv/bin/activate
          uv pip sync requirements.lock
          uv pip install ruff
          ruff check . || echo "Linting completed with warnings"
          ruff format --check . || echo "Format check completed with warnings"

  type-check:
    name: Static Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: |
          cd ./payload
          uv venv
          source .venv/bin/activate
          uv pip sync requirements.lock
          uv pip install -e .
          uv pip install mypy types-PyYAML
          mypy src/ || echo "Type checking completed with warnings"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install uv
      - run: |
          cd ./payload
          uv venv
          source .venv/bin/activate
          uv pip sync requirements.lock
          uv pip install -e .
          uv pip install "pytest" "pytest-mock"
          pytest tests/unit

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          arch="$(uname -m)"
          case "$arch" in
            x86_64) asset_arch="x64" ;;
            aarch64|arm64) asset_arch="arm64" ;;
            *) echo "Unsupported runner architecture: $arch" >&2; exit 1 ;;
          esac
          wget -qO- "https://github.com/gitleaks/gitleaks/releases/download/v8.22.0/gitleaks_8.22.0_linux_${asset_arch}.tar.gz" | tar -xz
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Run Gitleaks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gitleaks detect --source . --verbose --redact --exit-code 1

